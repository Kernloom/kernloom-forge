action_constraints:
  # Action constraints bound the permitted effect of a policy action.
  # They appear in:
  #   effects[].constraints         — per-effect limits in a Policy rule
  #   PolicyAssignment.action_bounds — operator-level ceiling per node
  #
  # value_type semantics:
  #   duration  — Go duration string: "10m", "2h", "30s"
  #   ratio     — float in [0.0, 1.0]
  #   integer   — non-negative integer
  #   boolean   — true | false
  #
  # applies_to lists the effect types that may carry this constraint.

  # ── Time bounds ───────────────────────────────────────────────────────────────

  - id: ttl
    value_type: duration
    description: >
      How long the enforcement entry stays active before automatic removal.
      After TTL expires KLIQ removes the entry and the source returns to observe.
    applies_to: [action]
    example: "10m"

  - id: max_duration
    value_type: duration
    description: >
      Upper bound on total accumulated enforcement duration for a single source.
      Prevents indefinite enforcement that accumulates across repeated rule firings.
    applies_to: [action]
    example: "1h"

  # ── Traffic bounds ────────────────────────────────────────────────────────────

  - id: max_drop_ratio
    value_type: ratio
    description: >
      Maximum fraction of traffic that may be dropped (0.0–1.0).
      Enforcement must not result in a higher drop ratio than this value.
      Protects against over-aggressive enforcement in autonomy mode.
    applies_to: [action]
    range: [0.0, 1.0]
    example: 0.5

  - id: min_allowed_rate_per_second
    value_type: integer
    description: >
      Floor rate in packets per second. Rate-limit enforcement may not go below
      this value regardless of what the baseline or directive would otherwise
      produce. Prevents complete starvation of a source.
    applies_to: [action]
    example: 10

  # ── Granularity bounds ────────────────────────────────────────────────────────

  - id: allowed_granularities
    value_type: string_list
    description: >
      Restricts which granularities the action may apply to.
      If the rule requests a finer granularity than allowed, the enforcement
      is widened to the coarsest allowed granularity.
      Values must reference entries in granularities.yaml.
    applies_to: [action]
    example: ["src_ip", "tuple_5"]

  # ── Notification bounds ───────────────────────────────────────────────────────

  - id: max_alerts_per_hour
    value_type: integer
    description: >
      Rate-limit on notify effects — at most N alerts per hour per source.
      Prevents alert fatigue during sustained anomalies.
    applies_to: [notify]
    example: 5

  # ── Export bounds ─────────────────────────────────────────────────────────────

  - id: sample_ratio
    value_type: ratio
    description: >
      Fraction of matching events to actually export (0.0–1.0).
      Used to reduce export volume for high-frequency rules.
    applies_to: [export]
    range: [0.0, 1.0]
    example: 0.1
