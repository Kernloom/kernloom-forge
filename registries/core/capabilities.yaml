capabilities:
  # ── Observe: Network ─────────────────────────────────────────────────────────

  - id: observe.network.packet_summary
    category: observe
    domain: network
    allowed_roles: [pep, sensor]
    produces_signals:
      - network.metric.packets_per_second
      - network.metric.bytes_per_second
      - network.metric.syn_per_second
      - network.metric.drop_count
    risk_class: safe

  - id: observe.network.connection
    category: observe
    domain: network
    allowed_roles: [pep, sensor]
    produces_signals:
      - network.metric.connections_per_second
      - network.entity.src_ip
      - network.entity.dst_ip
      - network.entity.dst_port
      - network.entity.protocol
    risk_class: safe

  # Kept for backward compatibility; prefer observe.network.connection.
  - id: observe.network.connection_attempt
    category: observe
    domain: network
    allowed_roles: [pep, sensor]
    produces_signals:
      - network.metric.packets_per_second
      - network.entity.src_ip
      - network.entity.dst_ip
      - network.entity.dst_port
      - network.entity.protocol
    risk_class: safe

  # ── Observe: TLS ─────────────────────────────────────────────────────────────

  - id: observe.tls.client_hello
    category: observe
    domain: tls
    allowed_roles: [pep, sensor]
    produces_signals:
      - tls.sni
      - tls.alpn
    risk_class: safe

  # ── Observe: App ─────────────────────────────────────────────────────────────

  - id: observe.app.request
    category: observe
    domain: app
    allowed_roles: [pep, sensor]
    risk_class: safe

  - id: observe.app.response
    category: observe
    domain: app
    allowed_roles: [pep, sensor]
    risk_class: safe

  # ── Observe: Identity ────────────────────────────────────────────────────────

  - id: observe.identity.subject
    category: observe
    domain: identity
    allowed_roles: [pep, sensor, pip]
    risk_class: safe

  - id: observe.identity.claims
    category: observe
    domain: identity
    allowed_roles: [pep, sensor, pip]
    risk_class: safe

  # ── Observe: Overlay ─────────────────────────────────────────────────────────

  - id: observe.overlay.session
    category: observe
    domain: overlay
    allowed_roles: [controller, sensor]
    risk_class: safe

  - id: observe.overlay.service
    category: observe
    domain: overlay
    allowed_roles: [controller, sensor]
    risk_class: safe

  # ── Enforce: Access (generic, role-neutral) ───────────────────────────────────

  - id: enforce.access.allow
    category: enforce
    domain: access
    allowed_roles: [pep]
    allowed_granularities:
      - src_ip
      - dst_ip
      - src_cidr
      - dst_cidr
      - dst_port
      - protocol
      - tuple_5
      - subject_id
      - overlay_identity_id
      - overlay_service_id
    supports_ttl: false
    supports_dry_run: true
    risk_class: privilege_granting

  - id: enforce.access.deny
    category: enforce
    domain: access
    allowed_roles: [pep]
    allowed_granularities:
      - src_ip
      - dst_ip
      - src_cidr
      - dst_cidr
      - src_port
      - dst_port
      - protocol
      - tuple_5
      - listener_id
      - subject_id
      - overlay_identity_id
      - overlay_service_id
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.access.default_deny
    category: enforce
    domain: access
    allowed_roles: [pep]
    allowed_granularities:
      - interface
      - interface_id
      - direction
      - dst_port
      - protocol
      - tuple_5
      - listener_id
      - overlay_identity_id
      - overlay_service_id
    supports_ttl: false
    supports_dry_run: true
    risk_class: disruptive

  # ── Enforce: Traffic ─────────────────────────────────────────────────────────

  - id: enforce.traffic.drop
    category: enforce
    domain: traffic
    allowed_roles: [pep]
    allowed_granularities:
      - src_ip
      - dst_ip
      - src_cidr
      - dst_cidr
      - dst_port
      - protocol
      - tuple_5
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.traffic.rate_limit
    category: enforce
    domain: traffic
    allowed_roles: [pep]
    allowed_granularities:
      - src_ip
      - dst_ip
      - dst_port
      - tuple_5
      - connection_id
      - listener_id
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive
    allowed_parameters:
      rate_pps:
        type: uint
        optional: true
        description: >
          Explicit rate limit in packets per second.
          When present: directive (access-control) mode — KLIQ applies this
          exact rate regardless of autotune or baseline.
          When absent: autonomy (DoS-protection) mode — KLIQ derives the rate
          from the autotune-learned baseline.

  - id: enforce.traffic.connection_limit
    category: enforce
    domain: traffic
    allowed_roles: [pep]
    allowed_granularities:
      - src_ip
      - listener_id
      - global
    supports_ttl: false
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.traffic.bandwidth_limit
    category: enforce
    domain: traffic
    allowed_roles: [pep]
    allowed_granularities:
      - connection_id
      - listener_id
      - src_ip
    supports_ttl: false
    supports_dry_run: false
    risk_class: disruptive

  - id: enforce.traffic.quarantine
    category: enforce
    domain: traffic
    allowed_roles: [pep]
    allowed_granularities:
      - src_ip
      - src_cidr
      - node_id
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.traffic.tarpit
    category: enforce
    domain: traffic
    allowed_roles: [pep]
    allowed_granularities:
      - src_ip
      - src_cidr
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive
    allowed_parameters:
      rate_pps:
        type: uint
        optional: true
        description: >
          Explicit hard rate limit in packets per second (directive mode).
          When absent: KLIQ derives hard rate from autotune baseline.

  # ── Enforce: Network (legacy — prefer enforce.access.* / enforce.traffic.*) ──

  - id: enforce.network.allow
    category: enforce
    domain: network
    allowed_roles: [pep]
    allowed_granularities: [src_ip, dst_ip, src_cidr, dst_cidr, dst_port, protocol, tuple_5]
    supports_ttl: false
    supports_dry_run: true
    risk_class: privilege_granting

  - id: enforce.network.deny
    category: enforce
    domain: network
    allowed_roles: [pep]
    allowed_granularities: [src_ip, dst_ip, src_cidr, dst_cidr, dst_port, protocol, tuple_5]
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.network.default_deny
    category: enforce
    domain: network
    allowed_roles: [pep]
    allowed_granularities: [interface, direction, dst_port, protocol, tuple_5]
    supports_ttl: false
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.network.rate_limit
    category: enforce
    domain: network
    allowed_roles: [pep]
    allowed_granularities: [src_ip, dst_ip, dst_port, tuple_5]
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.network.quarantine
    category: enforce
    domain: network
    allowed_roles: [pep]
    allowed_granularities: [src_ip, src_cidr, node_id]
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.network.syn_protect
    category: enforce
    domain: network
    allowed_roles: [pep]
    allowed_granularities: [global, interface, src_ip]
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive

  # ── Enforce: App ─────────────────────────────────────────────────────────────

  - id: enforce.app.allow
    category: enforce
    domain: app
    allowed_roles: [pep]
    allowed_granularities: [subject_id, route, service_id]
    supports_ttl: false
    supports_dry_run: true
    risk_class: privilege_granting

  - id: enforce.app.deny
    category: enforce
    domain: app
    allowed_roles: [pep]
    allowed_granularities: [subject_id, route, service_id]
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.app.default_deny
    category: enforce
    domain: app
    allowed_roles: [pep]
    allowed_granularities: [subject_id, service_id]
    supports_ttl: false
    supports_dry_run: true
    risk_class: disruptive

  # ── Enforce: Overlay ─────────────────────────────────────────────────────────

  - id: enforce.overlay.service_allow
    category: enforce
    domain: overlay
    allowed_roles: [controller]
    allowed_granularities: [overlay_identity, overlay_service, overlay_identity_id, overlay_service_id]
    supports_ttl: false
    supports_dry_run: true
    risk_class: privilege_granting

  - id: enforce.overlay.service_deny
    category: enforce
    domain: overlay
    allowed_roles: [controller]
    allowed_granularities: [overlay_identity, overlay_service, overlay_identity_id, overlay_service_id]
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.overlay.default_deny
    category: enforce
    domain: overlay
    allowed_roles: [controller]
    allowed_granularities: [overlay_identity, overlay_service, overlay_identity_id, overlay_service_id]
    supports_ttl: false
    supports_dry_run: true
    risk_class: disruptive

  - id: enforce.overlay.identity_allow
    category: enforce
    domain: overlay
    allowed_roles: [controller]
    allowed_granularities: [overlay_identity, overlay_identity_id]
    supports_ttl: false
    supports_dry_run: true
    risk_class: privilege_granting

  - id: enforce.overlay.identity_deny
    category: enforce
    domain: overlay
    allowed_roles: [controller]
    allowed_granularities: [overlay_identity, overlay_identity_id]
    supports_ttl: true
    supports_dry_run: true
    risk_class: disruptive

  # ── Route: Traffic ───────────────────────────────────────────────────────────

  - id: route.traffic.forward
    category: route
    domain: traffic
    allowed_roles: [pep]
    allowed_granularities: [listener_id, upstream_id, dst_port]
    supports_ttl: false
    supports_dry_run: false
    risk_class: disruptive

  - id: route.traffic.redirect
    category: route
    domain: traffic
    allowed_roles: [pep]
    allowed_granularities: [listener_id, upstream_id, dst_port, route]
    supports_ttl: false
    supports_dry_run: true
    risk_class: disruptive

  - id: route.traffic.load_balance
    category: route
    domain: traffic
    allowed_roles: [pep]
    allowed_granularities: [listener_id, upstream_id]
    supports_ttl: false
    supports_dry_run: false
    risk_class: safe

  # ── Analyze ───────────────────────────────────────────────────────────────────

  - id: analyze.baseline.learn
    category: analyze
    domain: baseline
    allowed_roles: [analyzer, pdp]
    risk_class: safe

  - id: analyze.baseline.compare
    category: analyze
    domain: baseline
    allowed_roles: [analyzer, pdp]
    produces_signals:
      - baseline.expected
      - baseline.upper_bound
      - baseline.lower_bound
      - baseline.deviation_ratio
      - baseline.confidence
      - baseline.phase
      - anomaly.score
      - anomaly.severity
      - anomaly.confidence
    risk_class: safe

  - id: analyze.anomaly.score
    category: analyze
    domain: anomaly
    allowed_roles: [analyzer, pdp]
    produces_signals:
      - anomaly.score.combined
      - anomaly.state.severity
      - anomaly.state.confidence
    risk_class: safe

  - id: analyze.risk.score
    category: analyze
    domain: risk
    allowed_roles: [analyzer, pdp]
    produces_signals:
      - risk.score
      - risk.level
      - risk.confidence
    risk_class: safe

  - id: analyze.relation.learn
    category: analyze
    domain: relation
    allowed_roles: [analyzer]
    produces_signals:
      - relation.state.known
      - relation.state.confidence
      - relation.state.lifecycle
    risk_class: safe

  - id: analyze.relation.classify
    category: analyze
    domain: relation
    allowed_roles: [analyzer]
    produces_signals:
      - relation.state.known
      - relation.state.confidence
    risk_class: safe

  - id: analyze.relation.freeze
    category: analyze
    domain: relation
    allowed_roles: [analyzer]
    risk_class: privilege_granting

  - id: analyze.relation.export_allowlist
    category: analyze
    domain: relation
    allowed_roles: [analyzer]
    risk_class: privilege_granting

  # ── Export / Sink ─────────────────────────────────────────────────────────────

  - id: export.event
    category: export
    domain: event
    allowed_roles: [sink, pdp]
    risk_class: safe

  - id: export.telemetry
    category: export
    domain: telemetry
    allowed_roles: [sink, pdp, analyzer]
    risk_class: safe

  - id: sink.webhook
    category: sink
    domain: event
    allowed_roles: [sink]
    risk_class: safe

  - id: sink.smtp
    category: sink
    domain: event
    allowed_roles: [sink]
    risk_class: safe

  # Kept for backward compatibility; prefer export.telemetry.
  - id: sink.correlate
    category: sink
    domain: event
    allowed_roles: [sink, pdp]
    risk_class: safe
