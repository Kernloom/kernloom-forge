adapter_types:
  - id: pep
    description: Policy Enforcement Point. Observes and enforces network traffic.
    allowed_capability_prefixes: [enforce, observe]

  - id: sensor
    description: Observes data without enforcement capability.
    allowed_capability_prefixes: [observe]

  - id: analyzer
    description: Produces derived analysis, scores and graph state.
    allowed_capability_prefixes: [analyze]

  - id: graph_engine
    description: Learns and classifies communication relations.
    allowed_capability_prefixes: [analyze.relation]

  - id: sink
    description: Exports events, metrics and telemetry to external systems.
    allowed_capability_prefixes: [sink, export]

  - id: platform_adapter
    description: >
      Bridge to an external policy platform or managed security service
      (e.g. Zscaler, Cloudflare Access, OpenZiti Controller, Azure AD CA).
      Translates Kernloom capability actions into the platform's native API.
    allowed_capability_prefixes: [enforce, observe, export, sink]

  - id: overlay_controller
    description: Controls overlay network or ZTNA policy objects (e.g. OpenZiti).
    allowed_capability_prefixes: [enforce.overlay, observe.overlay]

  - id: app_gateway
    description: Enforces application-layer policies (e.g. Envoy, NGINX, API gateway).
    allowed_capability_prefixes: [enforce.app, observe.app]

  - id: pdp
    description: Policy Decision Point. Evaluates policies and produces decisions and signals.
    allowed_capability_prefixes: [analyze, export, sink]
