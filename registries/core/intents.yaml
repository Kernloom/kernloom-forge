intents:
  # ── Access ────────────────────────────────────────────────────────────────────

  - id: access.relation.allow
    domain: access
    description: Allow a logical entity to communicate with another.
    inputs:
      required: [src, dst]
      optional: [protocol, port, constraints]
    risk_class: privilege_granting
    default_requires_approval: true
    compiles_to:
      - enforce.access.allow
      - enforce.network.allow
      - enforce.overlay.service_allow
      - enforce.app.allow

  - id: access.relation.default_deny
    domain: access
    description: Deny unknown relations unless explicitly allowed.
    inputs:
      required: [target]
      optional: [exceptions]
    risk_class: disruptive
    default_requires_approval: false
    compiles_to:
      - enforce.access.default_deny
      - enforce.network.default_deny
      - enforce.overlay.default_deny
      - enforce.app.default_deny

  # ── Protection ────────────────────────────────────────────────────────────────

  - id: protection.source.quarantine
    domain: protection
    description: Isolate or restrict a suspicious source.
    inputs:
      required: [source]
      optional: [ttl, reason]
    risk_class: disruptive
    default_requires_approval: false
    compiles_to:
      - enforce.access.deny
      - enforce.network.deny
      - enforce.traffic.rate_limit
      - enforce.network.rate_limit
      - enforce.overlay.identity_deny
      - enforce.app.deny

  - id: protection.dos.prevent
    domain: protection
    description: Prevent volumetric or connection-rate based abuse (legacy; prefer protection.dos.mitigate).
    inputs:
      required: [target]
      optional: [thresholds, ttl]
    risk_class: disruptive
    default_requires_approval: false
    compiles_to:
      - enforce.network.rate_limit
      - enforce.network.syn_protect
      - enforce.network.deny

  - id: protection.dos.mitigate
    domain: protection
    description: Mitigate volumetric or connection-rate based DoS using generic capabilities.
    inputs:
      required: [target]
      optional: [thresholds, ttl]
    risk_class: disruptive
    default_requires_approval: false
    compiles_to:
      - enforce.traffic.rate_limit
      - enforce.traffic.connection_limit
      - enforce.traffic.drop
      - enforce.access.deny

  - id: protection.abuse.mitigate
    domain: protection
    description: Mitigate abuse from a source that exceeds learned or static thresholds.
    inputs:
      required: [target]
      optional: [thresholds, ttl, baseline_signal]
    risk_class: disruptive
    default_requires_approval: false
    compiles_to:
      - enforce.traffic.rate_limit
      - enforce.access.deny

  # ── Relation ─────────────────────────────────────────────────────────────────

  - id: relation.learn
    domain: relation
    description: Learn normal communication relations between entities.
    inputs:
      required: [scope]
      optional: [duration, confidence]
    risk_class: safe
    default_requires_approval: false
    compiles_to:
      - analyze.relation.learn

  - id: relation.freeze
    domain: relation
    description: Freeze learned relations into a stable baseline for enforcement.
    inputs:
      required: [scope]
      optional: [approval_required]
    risk_class: privilege_granting
    default_requires_approval: true
    compiles_to:
      - analyze.relation.freeze
      - analyze.relation.export_allowlist

  - id: relation.enforce_known_only
    domain: relation
    description: Deny any communication that does not match a known, approved relation.
    inputs:
      required: [scope]
    risk_class: disruptive
    default_requires_approval: true
    compiles_to:
      - enforce.access.default_deny

  # ── Microsegmentation (legacy — prefer relation.*) ────────────────────────────

  - id: microsegmentation.learn
    domain: microsegmentation
    description: Learn normal communication relations between entities. Use relation.learn instead.
    inputs:
      required: [scope]
      optional: [duration, confidence]
    risk_class: safe
    default_requires_approval: false
    compiles_to:
      - analyze.relation.learn

  - id: microsegmentation.freeze
    domain: microsegmentation
    description: Freeze learned relations into a stable baseline. Use relation.freeze instead.
    inputs:
      required: [scope]
      optional: [approval_required]
    risk_class: privilege_granting
    default_requires_approval: true
    compiles_to:
      - analyze.relation.freeze
      - analyze.relation.export_allowlist

  # ── Telemetry ─────────────────────────────────────────────────────────────────

  - id: telemetry.export
    domain: telemetry
    description: Export events, decisions or metrics to an external sink.
    inputs:
      required: [sink]
      optional: [filter, format]
    risk_class: safe
    default_requires_approval: false
    compiles_to:
      - export.telemetry
      - export.event

  - id: telemetry.alert
    domain: telemetry
    description: Send an alert notification when a condition is met.
    inputs:
      required: [channel]
      optional: [severity, message]
    risk_class: safe
    default_requires_approval: false
    compiles_to:
      - sink.webhook
      - sink.smtp
