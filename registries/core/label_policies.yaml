# Kernloom Label Policy Registry
# Controls which metric labels are allowed in baseline profile keys.
# Default: selected_labels: [] — no labels in baseline keys (cardinality-safe).
# Adapters must not include labels absent from this list in baseline submissions.
label_policies:

  - id: host
    allowed: true
    cardinality: medium
    pii_risk: low
    description: Virtual host / SNI name (e.g. app.example.com)

  - id: status_class
    allowed: true
    cardinality: low
    pii_risk: none
    description: HTTP status class (2xx, 3xx, 4xx, 5xx)

  - id: route_group
    allowed: true
    cardinality: medium
    pii_risk: low
    description: Normalized route group (e.g. /api/orders/:id). Must be pre-normalized.

  - id: path_template
    allowed: true
    cardinality: medium
    pii_risk: medium
    requires_normalization: true
    description: Normalized path template — numeric/UUID segments replaced with placeholders.

  - id: service
    allowed: true
    cardinality: low
    pii_risk: none
    description: Logical service identifier (e.g. api-gateway, postgres)

  - id: protocol
    allowed: true
    cardinality: low
    pii_risk: none
    description: Network/application protocol (tcp, udp, http, grpc)

  # ── Forbidden labels ──────────────────────────────────────────────────────────
  # These labels must never appear in baseline profile keys.
  # Adapters that attach them to metrics must strip them before submission.

  - id: path
    allowed: false
    reason: raw path has high cardinality and may contain sensitive data

  - id: uri
    allowed: false
    reason: raw URI may include query strings and identifiers

  - id: full_url
    allowed: false
    reason: high cardinality, may contain credentials or session tokens

  - id: user_agent
    allowed: false
    reason: very high cardinality

  - id: session_id
    allowed: false
    reason: sensitive and extremely high cardinality

  - id: request_id
    allowed: false
    reason: unique per request — guaranteed 1:1 cardinality

  - id: username
    allowed: false
    reason: sensitive PII

  - id: authorization
    allowed: false
    reason: contains credentials

  - id: cookie
    allowed: false
    reason: sensitive and high cardinality
