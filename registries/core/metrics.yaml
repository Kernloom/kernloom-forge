# Kernloom Metric Registry
# Defines canonical metric IDs, value types, allowed scopes and baseline rules.
# All adapters must map their domain-specific data to IDs in this registry.
# Unknown metric IDs are warned/dropped depending on registry_validation config.
metrics:

  # ── Network (KLShield / L3-L4) ───────────────────────────────────────────────

  - id: network.packets_per_second
    domain: network
    value_type: rate
    unit: packets/s
    allowed_scopes: [src_ip, node, global]
    baseline_allowed: true
    high_cardinality_risk: low

  - id: network.bytes_per_second
    domain: network
    value_type: rate
    unit: bytes/s
    allowed_scopes: [src_ip, node, global]
    baseline_allowed: true
    high_cardinality_risk: low

  - id: network.syn_rate
    domain: network
    value_type: rate
    unit: packets/s
    allowed_scopes: [src_ip]
    baseline_allowed: true
    high_cardinality_risk: low

  - id: network.scan_rate
    domain: network
    value_type: rate
    unit: ports/window
    allowed_scopes: [src_ip]
    baseline_allowed: true
    high_cardinality_risk: medium

  - id: network.rate_limit_drop_rate
    domain: network
    value_type: rate
    unit: drops/s
    allowed_scopes: [src_ip, node]
    baseline_allowed: false
    high_cardinality_risk: low

  # ── HTTP (future NGINX / Envoy / HAProxy) ────────────────────────────────────

  - id: http.requests_per_second
    domain: http
    value_type: rate
    unit: requests/s
    allowed_scopes: [src_ip, service]
    baseline_allowed: true
    high_cardinality_risk: low

  - id: http.auth_fail_rate
    domain: http
    value_type: ratio
    unit: ratio
    allowed_scopes: [src_ip, service]
    baseline_allowed: true
    high_cardinality_risk: low

  - id: http.status_4xx_rate
    domain: http
    value_type: ratio
    unit: ratio
    allowed_scopes: [src_ip, service]
    baseline_allowed: true
    high_cardinality_risk: low

  - id: http.status_5xx_rate
    domain: http
    value_type: ratio
    unit: ratio
    allowed_scopes: [src_ip, service]
    baseline_allowed: true
    high_cardinality_risk: low

  - id: http.path_diversity
    domain: http
    value_type: count
    unit: distinct_paths/window
    allowed_scopes: [src_ip]
    baseline_allowed: true
    high_cardinality_risk: medium

  - id: http.method_diversity
    domain: http
    value_type: count
    unit: distinct_methods/window
    allowed_scopes: [src_ip]
    baseline_allowed: true
    high_cardinality_risk: low

  - id: http.request_bytes_per_second
    domain: http
    value_type: rate
    unit: bytes/s
    allowed_scopes: [src_ip, service]
    baseline_allowed: true
    high_cardinality_risk: low

  - id: http.latency_p95_ms
    domain: http
    value_type: percentile
    unit: ms
    allowed_scopes: [service]
    baseline_allowed: true
    high_cardinality_risk: low

  - id: http.upstream_error_rate
    domain: http
    value_type: ratio
    unit: ratio
    allowed_scopes: [service]
    baseline_allowed: true
    high_cardinality_risk: low

  # ── Trust (Keylime / trustd) ─────────────────────────────────────────────────

  - id: trust.attestation_fail_rate
    domain: trust
    value_type: ratio
    unit: ratio
    allowed_scopes: [node, service]
    baseline_allowed: false
    high_cardinality_risk: low

  # ── Overlay (OpenZiti / Cilium) ───────────────────────────────────────────────

  - id: overlay.session_failure_rate
    domain: overlay
    value_type: ratio
    unit: ratio
    allowed_scopes: [src_ip, service]
    baseline_allowed: true
    high_cardinality_risk: low
