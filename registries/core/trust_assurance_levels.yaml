trust_assurance_levels:
  # Trust assurance levels define an ordered scale of confidence in a node's
  # identity and integrity. Levels are ordered by the `level` integer —
  # higher = more trusted. Policies may compare via CEL:
  #
  #   trust.level == "verified"
  #   trust.assurance >= 4          # numeric comparison
  #
  # Kernloom Trust (Keylime-Bridge) produces trust assertions that set these
  # levels. Without Trust integration, nodes stay at "enrolled".
  #
  # The progression is additive: each level implies all lower levels are satisfied.

  - id: unknown
    level: 0
    description: >
      Trust state has not yet been evaluated. The node has not enrolled or
      no attestation attempt has been made. All enforcement actions that
      require trust should be blocked at this level.

  - id: untrusted
    level: 1
    description: >
      Node has been explicitly marked as untrusted — a previous attestation
      failed, the node was revoked, or a violation was detected. Active
      enforcement restrictions apply.

  - id: enrolled
    level: 2
    description: >
      Node has enrolled with Forge and been approved, but no cryptographic
      attestation has been performed. Identity is based on enrollment token
      and session token only. Default state for nodes without Trust integration.

  - id: partially_trusted
    level: 3
    description: >
      Some attestation checks have passed (e.g. TPM identity verified) but
      not all required measurements are valid (e.g. IMA log not yet fully
      verified or some files are not yet measured). May be used as a
      transition state during attestation.

  - id: verified
    level: 4
    description: >
      All configured attestation checks have passed. Node identity is
      cryptographically verified and the software configuration matches
      the expected state. Standard level for fully managed nodes.

  - id: attested
    level: 5
    description: >
      Full attestation chain verified: TPM identity, IMA file measurements,
      Keylime policy evaluation, and optionally SBOM verification all passed.
      Highest assurance level — required for nodes handling sensitive workloads.
