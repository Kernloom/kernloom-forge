apiVersion: kernloom.io/v1alpha1
kind: ContextKeyRegistry

metadata:
  name: kernloom-canonical-context
  version: "1.0"

spec:
  keys:

    # ── Subject ───────────────────────────────────────────────────────────────
    # An actor requesting or performing an action.
    # Subject is always a human user, service account, workload or automation.

    - id: subject.id
      type: string
      scope: subject
      sensitivity: low
      defaultTTL: 8h
      description: Canonical subject identifier (stable across vendor systems).

    - id: subject.type
      type: string_enum
      values: [user, service_account, workload, device_identity, automation_identity, external_partner]
      scope: subject
      sensitivity: low
      defaultTTL: 8h
      description: Classification of the subject type.

    - id: subject.role
      type: string
      scope: subject
      sensitivity: low
      defaultTTL: 8h
      permittedSources: [identity_provider, cmdb, forge]
      description: Primary enterprise role of the subject (e.g. "investors", "admins").

    - id: subject.group
      type: string_list
      scope: subject
      sensitivity: low
      defaultTTL: 8h
      permittedSources: [identity_provider]
      description: Enterprise group memberships of the subject.

    - id: subject.identity_assurance
      type: string_enum
      values: [none, low, medium, high, very_high]
      scope: subject
      sensitivity: low
      defaultTTL: 8h
      permittedSources: [identity_provider]
      description: Identity assurance level from the IdP.

    - id: subject.employment_status
      type: string_enum
      values: [active, on_leave, offboarding, terminated, contractor, unknown]
      scope: subject
      sensitivity: medium
      defaultTTL: 1h
      permittedSources: [hr_system, identity_provider]
      description: Employment status from HR or IdP directory.

    - id: subject.risk.level
      type: string_enum
      values: [low, medium, high, critical, unknown]
      scope: subject
      sensitivity: medium
      defaultTTL: 30m
      permittedSources: [kernloom_risk_engine, correlate]
      description: >
        Enterprise risk level for the subject. Produced by the Kernloom Risk
        Engine or Correlate. Must NOT be set directly from vendor assessments
        without an explicit normalization mapping.

    - id: subject.behavior.anomaly_detected
      type: boolean
      scope: subject
      sensitivity: medium
      defaultTTL: 15m
      permittedSources: [kliq, correlate, kernloom_risk_engine]
      description: True when a behavioral anomaly has been detected for this subject.

    # ── Device ────────────────────────────────────────────────────────────────
    # The endpoint, machine or mobile device used by the subject.

    - id: device.id
      type: string
      scope: device
      sensitivity: low
      defaultTTL: 24h
      description: Canonical device identifier.

    - id: device.management.status
      type: string_enum
      values: [managed, unmanaged, unknown]
      scope: device
      sensitivity: low
      defaultTTL: 1h
      permittedSources: [mdm, cmdb]
      description: Whether the device is managed by the enterprise MDM.

    - id: device.posture.status
      type: string_enum
      values: [healthy, degraded, unhealthy, unknown]
      scope: device
      sensitivity: medium
      defaultTTL: 15m
      permittedSources: [edr, mdm, kernloom_risk_engine]
      description: >
        Enterprise device posture status. Aggregates EDR health, patch status,
        encryption and configuration drift. This is NOT equivalent to a vendor
        posture check result — vendor results must be explicitly normalized first.

    - id: device.edr.status
      type: string_enum
      values: [healthy, unhealthy, unknown]
      scope: device
      sensitivity: medium
      defaultTTL: 10m
      permittedSources: [edr]
      description: >
        Device health as reported by the EDR agent. Vendor-normalized canonical
        signal. Not the same as device.posture.status (which is an aggregation).

    - id: device.attestation.status
      type: string_enum
      values: [attested, not_attested, failed, unknown]
      scope: device
      sensitivity: medium
      defaultTTL: 1h
      permittedSources: [trust, keylime]
      description: Hardware attestation status from Trust/Keylime.

    - id: device.risk.level
      type: string_enum
      values: [low, medium, high, critical, unknown]
      scope: device
      sensitivity: medium
      defaultTTL: 30m
      permittedSources: [kernloom_risk_engine, correlate]
      description: Enterprise risk level for the device.

    # ── Resource ──────────────────────────────────────────────────────────────
    # The system, application, service or data being accessed.

    - id: resource.id
      type: string
      scope: resource
      sensitivity: low
      defaultTTL: 24h
      description: Canonical resource identifier.

    - id: resource.type
      type: string
      scope: resource
      sensitivity: low
      defaultTTL: 24h
      description: Resource type (e.g. "application_group", "service", "database").

    - id: resource.application_group
      type: string
      scope: resource
      sensitivity: low
      defaultTTL: 24h
      permittedSources: [cmdb, forge]
      description: Enterprise application group name (e.g. "investor-apps").

    - id: resource.data_class
      type: string_enum
      values: [public, internal, confidential, restricted, secret]
      scope: resource
      sensitivity: low
      defaultTTL: 24h
      permittedSources: [cmdb, forge]
      description: Data classification of the resource.

    - id: resource.criticality
      type: string_enum
      values: [low, medium, high, critical]
      scope: resource
      sensitivity: low
      defaultTTL: 24h
      permittedSources: [cmdb, forge]
      description: Business criticality of the resource.

    - id: resource.environment
      type: string_enum
      values: [development, staging, production, dr]
      scope: resource
      sensitivity: low
      defaultTTL: 24h
      permittedSources: [cmdb, forge]
      description: Deployment environment of the resource.

    - id: resource.owner
      type: string
      scope: resource
      sensitivity: low
      defaultTTL: 24h
      permittedSources: [cmdb]
      description: Business or technical owner of the resource.

    # ── Session ───────────────────────────────────────────────────────────────
    # The current authentication and connection context.

    - id: session.id
      type: string
      scope: session
      sensitivity: medium
      defaultTTL: 1h
      description: Canonical session identifier.

    - id: session.authentication.strength
      type: string_enum
      values: [none, password, mfa, phishing_resistant_mfa]
      scope: session
      sensitivity: low
      defaultTTL: 8h
      permittedSources: [identity_provider]
      description: Authentication assurance level for the current session.

    - id: session.location
      type: string
      scope: session
      sensitivity: medium
      defaultTTL: 1h
      permittedSources: [identity_provider, network_pip]
      description: Geographic or network location of the session.

    - id: session.network_zone
      type: string_enum
      values: [internal, dmz, external, vpn, zero_trust_overlay, unknown]
      scope: session
      sensitivity: low
      defaultTTL: 1h
      permittedSources: [network_pip, identity_provider]
      description: Network zone from which the session originates.

    - id: session.risk.level
      type: string_enum
      values: [low, medium, high, critical, unknown]
      scope: session
      sensitivity: medium
      defaultTTL: 30m
      permittedSources: [kernloom_risk_engine, identity_provider]
      description: Risk level for the current session.

    # ── Communication Edge ────────────────────────────────────────────────────
    # The relationship between two communicating entities.

    - id: communication.edge.status
      type: string_enum
      values: [known, candidate, first_seen, anomalous, denied, expired]
      scope: edge
      sensitivity: low
      defaultTTL: 24h
      permittedSources: [kliq, correlate]
      description: >
        Lifecycle status of a communication relationship as learned by KLIQ's
        graph baseline. "first_seen" means this edge has never been observed before.

    - id: communication.edge.first_seen_at
      type: string
      scope: edge
      sensitivity: low
      defaultTTL: 24h
      permittedSources: [kliq, correlate]
      description: ISO timestamp when this communication edge was first observed.

    # ── Component / Infrastructure ────────────────────────────────────────────

    - id: component.pip.health
      type: string_enum
      values: [healthy, degraded, unavailable]
      scope: component
      sensitivity: low
      defaultTTL: 1m
      description: >
        Health status of a PIP adapter. Degraded or unavailable PIPs affect
        the usability of context facts they supply.
