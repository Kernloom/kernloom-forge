kind: AdapterDefinition
apiVersion: forge.kernloom.io/v1alpha2

# kernloom.netfilter — Netfilter (iptables/nftables) PEP adapter.
# Compatibility/legacy adapter for systems where klshield/XDP is unavailable:
# older kernels, NAS appliances (Synology, QNAP, TrueNAS), container environments
# without CAP_NET_ADMIN for BPF map creation.
#
# Backends (auto-selected at startup, best available):
#   nftables       — preferred on modern Linux (kernel 4.18+)
#   iptables-nft   — iptables frontend over nf_tables
#   iptables-legacy — full legacy iptables (e.g. Synology DSM)
#
# Not a replacement for klshield — telemetry fidelity and enforcement
# performance are lower. Use as primary adapter on legacy systems, or
# alongside klshield for defence-in-depth on modern systems.

metadata:
  id: kernloom.netfilter
  name: Kernloom Netfilter Adapter
  version: 0.1.0
  lifecycle: experimental
  description: >
    Netfilter (iptables/nftables) PEP adapter for Linux systems without XDP/eBPF.
    Enforces deny/allow/rate-limit policies via kernel Netfilter. Provides
    limited flow telemetry via conntrack for graph edge learning.

plugin_match:
  - kernloom.netfilter
  - netfilter

adapter:
  id: kernloom.netfilter
  roles:
    - pep
    - sensor
  backends:
    - nftables
    - iptables-nft
    - iptables-legacy
  profiles:
    - network.l3_l4_filter

placement:
  execution_model: kernel_filter
  enforcement_point: host_interface
  layer: l3_l4
  proximity: after_kernel_routing

implementation:
  runtime_mode: netfilter

# No observation capabilities.
# Graph learning and anomaly detection require klshield (XDP/eBPF) for
# accurate per-packet telemetry. Conntrack-based telemetry has different
# time granularity and would distort EWMA baselines when mixed with XDP data.
# When klshield is unavailable (e.g. NAS without XDP), this adapter provides
# enforcement only — graph topology must be learned separately or configured
# manually via Forge.

capabilities:
  - id: enforce.access.deny
    granularity: [src_ip, src_cidr, dst_ip, dst_cidr, dst_port, protocol, direction, interface]
    supports_ttl: true
    supports_dry_run: true
    backends: [nftables, iptables-legacy, iptables-nft]

  - id: enforce.access.allow
    granularity: [src_ip, src_cidr, dst_ip, dst_cidr, dst_port, protocol, direction, interface]
    supports_ttl: true
    supports_dry_run: true
    backends: [nftables, iptables-legacy, iptables-nft]

  - id: enforce.traffic.rate_limit
    granularity: [src_ip, src_cidr, dst_port, protocol, direction]
    supports_ttl: false
    supports_dry_run: true
    conditional: true
    condition: >
      iptables backend requires xt_hashlimit kernel module.
      nftables backend requires meter support (kernel 4.18+).
    backends: [nftables, iptables-legacy, iptables-nft]

constraints:
  semantic_depth: l3_l4
  visibility:
    source_ip: {available: true, integrity: direct}
    identity: {subject_id: unavailable, user_id: unavailable}
    app: {route: unavailable, method: unavailable, headers: unavailable}
  enforcement:
    inline: false
    fail_mode: fail_open
    supports_ttl: true
    supports_dry_run: true
    supports_atomic_update: true        # nftables: yes; iptables: yes via --noflush restore
    update_latency: local_moderate      # involves process spawn (nft/iptables)
  limitations:
    early_drop: false                   # enforced after kernel IP stack, not in XDP
    high_mpps_protection: false         # no per-packet kernel bypass
    per_packet_telemetry: false
    l7_visibility: false
    process_identity: false
    external_firewall_interaction: conservative  # never touches non-Kernloom chains

selection_traits:
  enforcement_position: post_routing
  runtime_cost: low                     # process spawn per apply, not per packet
  semantic_precision: coarse
  identity_awareness: none
  source_attribution: strong
  convergence_speed: fast               # ~100ms apply latency
