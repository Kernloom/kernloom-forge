kind: AdapterDefinition
apiVersion: forge.kernloom.io/v1alpha2

# KLIQ — canonical capability declaration for the Kernloom local intelligence agent.
# KLIQ acts as local PDP, analyzer, and controller. It evaluates policies, learns
# baselines, tracks communication graphs, and deploys enforcement plans to managed
# adapters (klshield, tcp-proxy, etc.).

metadata:
  id: kliq
  name: Kernloom IQ (KLIQ)
  version: 1.0.0
  description: >
    Local risk engine, PDP, and controller. Evaluates CEL policy conditions,
    learns per-source and graph baselines, and deploys compiled enforcement
    plans to locally managed adapters.

plugin_match:
  - builtin-kliq
  - kliq

adapter:
  id: kliq
  roles:
    - pdp
    - analyzer
    - controller
    - assessor
  profiles:
    - decision.local_pdp
    - analysis.behavior_baseline
    - analysis.relation_graph

implementation:
  runtime_mode: local_agent

capabilities:
  - id: analyze.baseline.learn
    supported_signals:
      - network.metric.packets_per_second
      - network.metric.bytes_per_second
      - network.metric.syn_per_second
    supported_scopes: [global, src_ip, tuple_5]
    produces_statistics:
      - expected
      - deviation_ratio
      - confidence
      - phase
      - sample_count

  - id: analyze.relation.learn
    supported_scopes: [relation_id, service_id]
    produces_signals:
      - relation.state.known
      - relation.state.confidence

  - id: analyze.risk.score
    supported_scopes: [global, node_id, src_ip, tuple_5, relation_id]
    produces_signals:
      - risk.score
      - risk.level

  - id: assess.config.asset
    description: Evaluate deployment config against AssessmentPolicy rules

constraints:
  semantic_depth: analyzer
  consistency:
    scope: local_node
    convergence: seconds

selection_traits:
  enforcement_position: control_plane
  runtime_cost: low
  semantic_precision: medium
  source_attribution: strong
  convergence_speed: fast
