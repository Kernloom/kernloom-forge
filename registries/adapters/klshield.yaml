kind: AdapterDefinition
apiVersion: forge.kernloom.io/v1alpha2

# KLShield — canonical capability declaration for the Kernloom eBPF/XDP adapter.
# One AdapterDefinition exists per known adapter type, not per deployed instance.
# Forge uses this to determine which policy rules can be compiled for a node
# that runs klshield, and to auto-assign this definition during enrollment.

metadata:
  id: klshield
  name: Kernloom Shield (eBPF/XDP)
  version: 1.0.0
  description: >
    Inline kernel-space packet filter using eBPF/XDP. Operates before the kernel
    network stack. Provides L3/L4 source-IP telemetry and rate-limit/deny enforcement.
    No L7 context, no connection tracking, no identity awareness.

# plugin_match declares which plugin IDs in the KLIQ component inventory
# identify this adapter. Used for auto-assignment during enrollment.
plugin_match:
  - builtin-klshield
  - klshield

adapter:
  id: klshield
  roles:
    - pep
    - sensor
  profiles:
    - network.l3_l4_filter

placement:
  execution_model: inline_kernel_filter
  enforcement_point: host_interface
  layer: l3_l4
  proximity: before_kernel_stack

implementation:
  runtime_mode: xdp

capabilities:
  - id: observe.network.packet_summary
    scopes: [interface_id, direction, src_ip, dst_ip, protocol]
    produces_signals:
      - network.metric.packets_per_second
      - network.metric.bytes_per_second
      - network.metric.syn_per_second
      - network.metric.drop_count

  - id: observe.network.connection
    scopes: [src_ip, dst_ip, dst_port, protocol, tuple_5]
    produces_signals:
      - network.entity.src_ip
      - network.entity.dst_ip
      - network.entity.dst_port
      - network.entity.protocol
      - network.metric.connections_per_second

  - id: enforce.access.deny
    granularity: [src_ip, dst_port, protocol, tuple_5]
    supports_ttl: true
    supports_dry_run: true

  - id: enforce.traffic.rate_limit
    granularity: [src_ip, dst_port, tuple_5]
    supports_ttl: true
    supports_dry_run: true

  - id: enforce.traffic.tarpit
    granularity: [src_ip]
    supports_ttl: true
    supports_dry_run: true

  - id: enforce.access.default_deny
    granularity: [interface, direction, dst_port, protocol]
    supports_ttl: false
    supports_dry_run: true

constraints:
  semantic_depth: l3_l4
  visibility:
    source_ip: {available: true, integrity: direct}
    identity: {subject_id: unavailable, user_id: unavailable}
    app: {route: unavailable, method: unavailable, headers: unavailable}
  enforcement:
    inline: true
    fail_mode: fail_open
    supports_ttl: true
    supports_dry_run: true
    supports_atomic_update: true
    update_latency: local_fast

selection_traits:
  enforcement_position: early
  runtime_cost: very_low
  semantic_precision: coarse
  identity_awareness: none
  source_attribution: strong
  convergence_speed: immediate
