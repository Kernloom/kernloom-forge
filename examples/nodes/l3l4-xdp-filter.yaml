kind: NodeDefinition
apiVersion: forge.kernloom.io/v1alpha2

# L3/L4 XDP filter node: inline kernel-space packet filter with BPF enforcement.
# Standalone example — can also be a managed adapter behind a local risk engine.
# Operates before the kernel network stack; no connection tracking, no L7 context.

metadata:
  id: l3l4-xdp-filter-edge-01
  name: L3/L4 XDP Filter
  version: 0.3.0

adapter:
  id: l3l4-xdp-filter-edge-01
  roles:
    - pep
    - sensor
  profiles:
    - network.l3_l4_filter

placement:
  execution_model: inline_kernel_filter
  enforcement_point: host_interface
  layer: l3_l4
  proximity: before_kernel_stack
  interfaces:
    - eth0

implementation:
  runtime_mode: xdp

capabilities:
  - id: observe.network.packet_summary
    scopes:
      - interface_id
      - direction
      - src_ip
      - dst_ip
      - protocol
    produces_signals:
      - network.metric.packets_per_second
      - network.metric.bytes_per_second
      - network.metric.syn_per_second
      - network.metric.drop_count

  - id: observe.network.connection
    scopes:
      - src_ip
      - dst_ip
      - dst_port
      - protocol
      - tuple_5
    produces_signals:
      - network.entity.src_ip
      - network.entity.dst_ip
      - network.entity.dst_port
      - network.entity.protocol
      - network.metric.connections_per_second

  - id: enforce.access.deny
    granularity:
      - src_ip       # ingress only; egress not yet implemented
      - dst_port
      - protocol
      - tuple_5
    supports_ttl: true
    supports_dry_run: true

  - id: enforce.traffic.rate_limit
    granularity:
      - src_ip
      - dst_port
      - tuple_5
    supports_ttl: true
    supports_dry_run: true

  - id: enforce.traffic.tarpit
    granularity:
      - src_ip
    supports_ttl: true
    supports_dry_run: true

  - id: enforce.access.default_deny
    granularity:
      - interface
      - interface_id
      - direction
      - dst_port
      - protocol
      - tuple_5
    supports_ttl: false
    supports_dry_run: true

constraints:
  semantic_depth: l3_l4
  visibility:
    source_ip:
      available: true
      integrity: direct
    identity:
      subject_id: unavailable
      user_id: unavailable
    app:
      route: unavailable
      method: unavailable
      headers: unavailable
      body: unavailable
  enforcement:
    inline: true
    fail_mode: fail_open
    supports_ttl: true
    supports_dry_run: true
    supports_atomic_update: true
    supports_rollback: true
    update_latency: local_fast
  consistency:
    scope: local_node
    convergence: immediate

selection_traits:
  enforcement_position: early
  runtime_cost: very_low
  semantic_precision: coarse
  identity_awareness: none
  app_awareness: none
  source_attribution: strong
  convergence_speed: immediate
  blast_radius: node
