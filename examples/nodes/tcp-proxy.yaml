kind: NodeDefinition
apiVersion: forge.kernloom.io/v1alpha2

# TCP proxy node: connection-level proxy with src_ip / listener / CIDR enforcement.
# No HTTP semantics; optional TLS SNI pre-read. Suitable for stream-mode gateways.

metadata:
  id: tcp-proxy-edge-01
  name: TCP Proxy Gateway
  version: 1.0.0

adapter:
  id: tcp-proxy-edge-01
  roles:
    - pep
    - sensor
  profiles:
    - network.transport_proxy

placement:
  execution_model: reverse_proxy
  enforcement_point: tcp_listener
  layer: l4
  proximity: before_backend_service
  listeners:
    - id: public-443
      port: 443
      protocol: tcp

implementation:
  runtime_mode: stream_proxy

capabilities:
  - id: route.traffic.forward
    granularity:
      - listener_id
      - upstream_id
      - dst_port
    supports_dry_run: false

  - id: observe.network.connection
    scopes:
      - listener_id
      - upstream_id
      - src_ip
      - dst_port
      - protocol
    produces_signals:
      - network.entity.src_ip
      - network.entity.dst_port
      - network.entity.protocol
      - network.metric.connections_per_second

  - id: enforce.access.deny
    granularity:
      - src_ip
      - src_cidr
      - listener_id
      - dst_port
    supports_ttl: false
    supports_dry_run: true

  - id: enforce.traffic.connection_limit
    granularity:
      - src_ip
      - listener_id
    supports_ttl: false
    supports_dry_run: true

  - id: enforce.traffic.bandwidth_limit
    granularity:
      - connection_id
      - listener_id
    supports_ttl: false
    supports_dry_run: false

optional_capabilities:
  - id: observe.tls.client_hello
    scopes:
      - connection_id
    produces_signals:
      - tls.sni
      - tls.alpn

constraints:
  semantic_depth: l4_connection
  visibility:
    source_ip:
      available: true
      integrity: direct_or_proxy_protocol
    tls:
      sni: preread_optional
      alpn: preread_optional
    identity:
      subject_id: unavailable
    app:
      route: unavailable
      method: unavailable
      headers: unavailable
      body: unavailable
  enforcement:
    inline: true
    fail_mode: fail_open
    supports_ttl: false
    supports_dry_run: true
    supports_atomic_update: false
    supports_rollback: true
    update_latency: local_slow
  consistency:
    scope: local_node
    convergence: seconds

selection_traits:
  enforcement_position: mid
  runtime_cost: low
  semantic_precision: medium
  identity_awareness: none
  app_awareness: none
  source_attribution: conditional
  convergence_speed: fast
  blast_radius: listener
