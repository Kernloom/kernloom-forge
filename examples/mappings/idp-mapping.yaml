apiVersion: kernloom.io/v1
kind: RequirementMapping
metadata:
  name: idp-mapping
  target: idp
spec:
  version: "1.0"
  rules:
    - requirementKind: subject_identity
      targetField: conditional_access_policy.user_groups
      translationNote: >
        Map subject role ref to an IdP group assignment.
        E.g. role "investors" → Entra group "grp-investors" or Okta group "Investors".

    - requirementKind: resource_identity
      targetField: conditional_access_policy.target_resources
      translationNote: >
        Map application_group ref to one or more enterprise application
        registrations in the IdP.
        E.g. application_group "investor-apps" → Entra Enterprise App IDs
        or Okta application assignments for the investors group.

    - requirementKind: auth_strength
      targetField: conditional_access_policy.grant_controls.require_mfa
      translationNote: >
        Map auth_strength gte mfa to require_mfa: true in the conditional
        access grant control. For stronger assurances (phishing-resistant MFA),
        use authentication_strength policies where supported.

    - requirementKind: risk_level
      targetField: conditional_access_policy.conditions.user_risk_levels
      semanticDowngrade:
        from: >
          Enterprise risk level: continuous EDR/SIEM-driven composite score.
        to: >
          IdP sign-in risk: IdP-native risk at authentication time only.
        reason: >
          IdP risk signals cover authentication-time signals only. Post-login
          continuous risk from EDR/SIEM requires custom claims injection.
      translationNote: >
        Map subject.risk.level == low to userRiskLevels: ["none", "low"].
        Note: this is evaluated only at sign-in, not continuously.

    - requirementKind: device_posture
      targetField: conditional_access_policy.grant_controls.require_compliant_device
      semanticDowngrade:
        from: >
          Enterprise device posture: healthy combining EDR, patch, encryption, drift.
        to: >
          IdP device compliance: MDM-reported compliant status only.
        reason: >
          IdP compliance reflects MDM status. EDR nuance requires custom claims.
      translationNote: >
        Map device.posture.status == healthy to require_compliant_device: true.
        Requires MDM (Intune/Jamf) integration with the IdP.

    - requirementKind: session_context
      targetField: conditional_access_policy.conditions.locations
      translationNote: >
        Map session context conditions (e.g. location) to named locations
        or IP ranges in IdP conditional access.
