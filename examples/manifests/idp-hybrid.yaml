apiVersion: kernloom.io/v1
kind: CapabilityManifest
metadata:
  name: idp-hybrid
  version: "1.0"
spec:
  targetType: identity_system

  # hybrid_out_of_band: IdP conditional access remains the in-path gate on
  # every authentication attempt. Kernloom's Risk Engine evaluates enterprise
  # signals out-of-band and can issue TTL-bounded emergency restrictions
  # (session revocation, account suspension, step-up MFA).
  #
  # This is NOT a per-auth-request gate. Kernloom does not intercept sign-ins.
  # The effective access is:
  #   final_access = idp_ca_allows AND NOT kernloom_restriction_active
  #
  # Critical constraint: OAuth2/OIDC token lifetime lag.
  # Active access tokens remain valid until natural expiry (~1h typical) even
  # after session revocation. Design risk thresholds and TTL values with this
  # lag in mind. This is an OIDC architectural property, not a Kernloom limit.
  #
  # Decision timing:  near-runtime (seconds to minutes via Management API)
  # Decision path:    out-of-band (Management API, not auth path)
  # Convergence:      eventual (token lag applies)
  # In-path PDP:      IdP conditional access engine
  integrationMode: hybrid_out_of_band

  # Shares the base idp requirement mapping.
  adapterRef: idp

  runtimeOwner: vendor
  configOwner: kernloom

  ownership:
    intentOwner: enterprise-pms
    # IdP collects sign-in context per auth attempt. Kernloom PIPs collect
    # out-of-band EDR/SIEM signals fed to the Risk Engine separately.
    runtimeContextOwner: vendor
    # Kernloom Risk Engine aggregates EDR, SIEM, endpoint signals into
    # a risk assessment. Distinct from the Runtime PDP decision.
    riskDecisionOwner: kernloom-risk-engine
    # IdP CA makes the per-sign-in access decision. Kernloom's Runtime PDP
    # modifies IdP state asynchronously when risk thresholds are exceeded.
    runtimeDecisionOwner: vendor
    # IdP evaluates its own CA rules on every auth attempt, including state
    # changes made by Kernloom runtime actions.
    policyEvaluationOwner: vendor
    enforcementOwner: vendor
    configOwner: kernloom

  requirementCoverage:
    subject_identity:  full
    resource_identity: full
    auth_strength:     delegated
    risk_level:        runtime_action
    device_posture:    runtime_action
    session_context:   full
    network_tuple:     unsupported
    custom:            unsupported

  delegationNotes:
    auth_strength: >
      MFA conditional access configured by Kernloom via IdP management API.
      The IdP evaluates MFA requirements on every sign-in. Kernloom does not
      intercept individual auth requests.

  downgrades:
    - requirement: risk_level
      from: >
        Enterprise risk level: continuous composite score evaluated near-
        continuously against every access attempt.
      to: >
        IdP emergency restriction: TTL-bounded session revocation or account
        suspension. In-flight access tokens remain valid for their remaining
        lifetime (~1h) before expiry forces re-authentication through updated
        IdP state. Token lifetime lag is an OIDC architectural constraint.
      reason: >
        IdP-based enforcement gates at authentication time. Kernloom cannot
        invalidate in-flight access tokens — only revoke refresh tokens and
        force re-authentication via IdP state change.

    - requirement: device_posture
      from: >
        Enterprise device posture: continuous EDR health, patch status,
        encryption, configuration drift evaluated on every access attempt.
      to: >
        IdP compliance check (MDM-reported, at sign-in) plus Kernloom TTL
        actions when posture degrades critically. Token lifetime lag applies.
      reason: >
        MDM compliance is evaluated at sign-in. Kernloom adds out-of-band
        enforcement for posture degradation events between sign-ins but
        cannot revoke in-flight tokens.

  runtimeActions:
    - action: revoke_active_sessions
      scope: identity
      requiresTTL: true
      autoRevert: true
      note: >
        Revokes all active refresh tokens (Microsoft Graph revokeSignInSessions,
        Okta lifecycle API). Forces re-auth on next API call. Access tokens
        remain valid until natural expiry. Monotonically restrictive.

    - action: force_mfa_step_up
      scope: identity
      requiresTTL: true
      autoRevert: true
      note: >
        Adds a temporary "require fresh MFA" signal via custom security
        attributes or a dedicated high-risk CA policy. On next re-auth, the
        IdP demands fresh MFA. Auto-reverted after TTL.

    - action: disable_account_temporary
      scope: identity
      requiresTTL: true
      autoRevert: true
      note: >
        Disables the account (accountEnabled=false / Okta deactivate) for the
        TTL duration. Prevents new sign-ins. Existing access tokens remain
        valid until expiry. Use only for high/critical risk.

    - action: activate_restricted_access_policy
      scope: conditional_access_policy
      requiresTTL: true
      autoRevert: true
      note: >
        Activates a pre-staged "kernloom-restricted" CA policy for the identity
        or group (e.g. require managed device, deny non-trusted locations).
        Requires a pre-configured CA policy in the IdP. Auto-reverted after TTL.
