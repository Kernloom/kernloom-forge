apiVersion: kernloom.io/v1
kind: CapabilityManifest
metadata:
  name: idp-hybrid
  version: "1.0"
spec:
  targetType: identity_system
  integrationMode: hybrid_out_of_band
  adapterRef: idp
  runtimeOwner: vendor
  configOwner: kernloom

  ownership:
    intent:
      owner: kernloom
      component: pms
    # IdP collects sign-in context per auth attempt.
    # Kernloom PIPs collect out-of-band EDR/SIEM signals for the Risk Engine.
    runtimeContext:
      owner: vendor
      component: controller
    # Risk Engine aggregates EDR/SIEM signals into a risk assessment.
    # Separate from the Runtime PDP decision.
    riskDecision:
      owner: kernloom
      component: risk-engine
    # IdP CA makes the per-sign-in decision. Kernloom's Runtime PDP modifies
    # IdP state asynchronously when risk thresholds are exceeded.
    runtimeDecision:
      owner: vendor
      component: controller
    # IdP holds the mutable authentication state (sessions, token grants)
    # that runtime actions modify.
    runtimeState:
      owner: vendor
      component: controller
    policyEvaluation:
      owner: vendor
      component: controller
    enforcement:
      owner: vendor
      component: token-service
    config:
      owner: kernloom
      component: pms

  requirementCoverage:
    subject_identity:  full
    resource_identity: full
    auth_strength:     delegated
    risk_level:        runtime_action
    device_posture:    runtime_action
    session_context:   full
    network_tuple:     unsupported
    custom:            unsupported

  delegationNotes:
    auth_strength: >
      MFA conditional access configured by Kernloom via IdP management API.
      The IdP evaluates MFA on every sign-in. Kernloom does not intercept
      individual auth requests.

  downgrades:
    - requirement: risk_level
      from: >
        Enterprise risk level: continuous composite score evaluated near-
        continuously against every access attempt.
      to: >
        IdP emergency restriction: TTL-bounded session revocation or account
        suspension. Active access tokens remain valid until natural expiry
        (~1h). Token lifetime lag is an OIDC architectural constraint, not
        a Kernloom limitation.
      reason: >
        IdP enforcement gates at authentication time. In-flight access tokens
        cannot be invalidated — only refresh tokens can be revoked.

    - requirement: device_posture
      from: >
        Enterprise device posture: continuous EDR health and drift signals.
      to: >
        IdP device compliance check (MDM-reported, at sign-in) plus Kernloom
        TTL actions when posture degrades. Token lifetime lag applies.
      reason: >
        MDM compliance is evaluated at sign-in. Kernloom adds out-of-band
        enforcement for posture events between sign-ins but cannot revoke
        in-flight tokens.

  runtimeActions:
    - action: revoke_active_sessions
      scope: identity
      requiresTTL: true
      autoRevert: true
      note: Revokes all refresh tokens. Forces re-auth on next API call. Monotonically restrictive.

    - action: force_mfa_step_up
      scope: identity
      requiresTTL: true
      autoRevert: true
      note: Adds temporary "require fresh MFA" via custom attributes or dedicated CA policy.

    - action: disable_account_temporary
      scope: identity
      requiresTTL: true
      autoRevert: true
      note: Disables account for TTL duration. Use only for high/critical risk.

    - action: activate_restricted_access_policy
      scope: conditional_access_policy
      requiresTTL: true
      autoRevert: true
      note: Activates pre-staged kernloom-restricted CA policy. Requires pre-configuration.
