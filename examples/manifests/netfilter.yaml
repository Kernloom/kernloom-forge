apiVersion: kernloom.io/v1
kind: CapabilityManifest
metadata:
  name: netfilter
  version: "1.0"
spec:
  targetType: local_pep
  integrationMode: config_only
  runtimeOwner: kernloom
  configOwner: kernloom

  ownership:
    intent:
      owner: kernloom
      component: pms
    runtimeContext:
      owner: kernloom
      component: pms
    riskDecision:
      owner: kernloom
      component: pms
    runtimeDecision:
      owner: kernloom
      component: pms
    runtimeState:
      owner: kernloom
      component: nftables
    policyEvaluation:
      owner: kernloom
      component: pms
    enforcement:
      owner: kernloom
      component: nftables
    config:
      owner: kernloom
      component: pms

  requirementCoverage:
    subject_identity:  unsupported
    resource_identity: partial
    auth_strength:     unsupported
    risk_level:        unsupported
    device_posture:    unsupported
    session_context:   unsupported
    network_tuple:     full
    custom:            unsupported

  delegationNotes: {}

  downgrades:
    - requirement: resource_identity
      from: >
        Enterprise resource identity: application_group "investor-apps"
        as a named logical grouping with enterprise semantic meaning.
      to: >
        nftables IP/port set compiled from service inventory.
      reason: >
        netfilter understands only network tuples. The application_group must
        be translated and kept in sync with service inventory.
