apiVersion: kernloom.io/v1
kind: CapabilityManifest
metadata:
  name: klshield
  version: "1.0"
spec:
  targetType: local_pep
  integrationMode: kernloom_pdp_native
  runtimeOwner: kernloom
  configOwner: kernloom

  ownership:
    intent:
      owner: kernloom
      component: pms
    runtimeContext:
      owner: kernloom
      component: pips
    # Risk Engine (KLIQ local or Correlate central) aggregates signals.
    # Separate from the Runtime PDP that evaluates policy.
    riskDecision:
      owner: kernloom
      component: risk-engine
    runtimeDecision:
      owner: kernloom
      component: runtime-pdp
    # Mutable enforcement state: XDP/TC eBPF maps, rate limit buckets.
    runtimeState:
      owner: kernloom
      component: ebpf-xdp
    # KLShield has no independent policy logic — policy evaluation is
    # fully owned by the Kernloom Runtime PDP.
    policyEvaluation:
      owner: kernloom
      component: runtime-pdp
    enforcement:
      owner: kernloom
      component: ebpf-xdp
    config:
      owner: kernloom
      component: pms

  requirementCoverage:
    subject_identity:  partial
    resource_identity: partial
    auth_strength:     unsupported
    risk_level:        runtime_action
    device_posture:    runtime_action
    session_context:   unsupported
    network_tuple:     full
    custom:            unsupported

  delegationNotes: {}

  downgrades:
    - requirement: subject_identity
      from: >
        Enterprise subject identity: role-based (e.g. "investors") from IdP.
      to: >
        KLShield process/cgroup identity: UID, cgroup path, or PID of the
        connecting process. Local service identity only.
      reason: >
        eBPF socket-level tracking identifies local processes but cannot access
        enterprise role membership from IdP.

    - requirement: resource_identity
      from: >
        Enterprise resource identity: application_group "investor-apps" as a
        named logical grouping with enterprise semantic meaning.
      to: >
        KLShield destination match: IP/port set compiled from service inventory.
      reason: >
        KLShield resolves resources to network tuples. The application_group must
        be translated and kept in sync with service inventory.

  runtimeActions:
    - action: deny_flow
      scope: flow
      requiresTTL: true
      autoRevert: true
      note: XDP DROP or TC action. Monotonically restrictive.

    - action: rate_limit_flow
      scope: flow
      requiresTTL: true
      autoRevert: true
      note: TC policer for graduated response before hard deny.

    - action: block_process_cgroup
      scope: cgroup
      requiresTTL: true
      autoRevert: true
      note: Block all network traffic for a cgroup (process group).

    - action: redirect_to_inspection
      scope: flow
      requiresTTL: true
      autoRevert: true
      note: TC redirect to inspection or quarantine endpoint.
