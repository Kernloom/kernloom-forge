apiVersion: kernloom.io/v1
kind: CapabilityManifest
metadata:
  name: idp
  version: "1.0"
spec:
  targetType: identity_system
  integrationMode: config_only
  runtimeOwner: vendor
  configOwner: kernloom

  ownership:
    intent:
      owner: kernloom
      component: pms
    runtimeContext:
      owner: vendor
      component: controller
    riskDecision:
      owner: vendor
      component: controller
    runtimeDecision:
      owner: vendor
      component: controller
    policyEvaluation:
      owner: vendor
      component: controller
    enforcement:
      owner: vendor
      component: token-service
    config:
      owner: kernloom
      component: pms

  requirementCoverage:
    subject_identity:  full
    resource_identity: full
    auth_strength:     full
    risk_level:        partial
    device_posture:    partial
    session_context:   full
    network_tuple:     unsupported
    custom:            unsupported

  delegationNotes: {}

  downgrades:
    - requirement: risk_level
      from: >
        Enterprise risk level: continuous EDR/SIEM-driven composite score.
      to: >
        IdP sign-in risk: IdP-native signal at authentication time only.
      reason: >
        IdP risk is evaluated only at authentication time. Continuous
        post-authentication risk requires custom claims injection.

    - requirement: device_posture
      from: >
        Enterprise device posture: healthy combining EDR, patch, encryption, drift.
      to: >
        IdP device compliance: compliant | not_compliant per MDM-reported status.
      reason: >
        IdP compliance reflects MDM status only. EDR nuance requires custom claims.
