apiVersion: kernloom.io/v1
kind: CapabilityManifest
metadata:
  name: openziti-config-only
  version: "1.0"
spec:
  targetType: vendor_sub_control_plane
  integrationMode: config_only
  adapterRef: openziti
  runtimeOwner: vendor
  configOwner: kernloom

  ownership:
    intent:
      owner: kernloom
      component: pms
    runtimeContext:
      owner: vendor
      component: controller
    riskDecision:
      owner: vendor
      component: controller
    runtimeDecision:
      owner: vendor
      component: controller
    policyEvaluation:
      owner: vendor
      component: controller
    enforcement:
      owner: vendor
      component: edge-router
    config:
      owner: kernloom
      component: pms

  requirementCoverage:
    subject_identity:  full
    resource_identity: full
    auth_strength:     delegated
    # OpenZiti has no native enterprise risk scoring. Posture checks are a
    # structural proxy — this is partial with semantic downgrade, not delegation.
    risk_level:        partial
    device_posture:    partial
    session_context:   unsupported
    network_tuple:     unsupported
    custom:            unsupported

  delegationNotes:
    auth_strength: >
      MFA enforcement configured via OpenZiti MFA posture check on the
      controller. Kernloom declares the requirement; OpenZiti evaluates it
      at every dial attempt.

  downgrades:
    - requirement: risk_level
      from: >
        Enterprise risk level: continuous EDR/SIEM-driven composite score
        evaluated near-continuously against post-authentication access.
      to: >
        OpenZiti posture check: binary pass/fail on configured static criteria.
        No EDR/SIEM signals consumed. Risk changes take effect only on next
        configuration deployment cycle.
      reason: >
        OpenZiti has no native enterprise risk scoring. Posture checks can
        approximate static device health but cannot represent continuous risk
        signals. For near-runtime risk enforcement, use hybrid_out_of_band.

    - requirement: device_posture
      from: >
        Enterprise posture: healthy | degraded | unhealthy | unknown,
        aggregated from EDR, patch status, encryption, configuration drift.
      to: >
        OpenZiti posture check: pass | fail on configured static criteria.
      reason: >
        OpenZiti posture checks are binary and static. Criteria must be
        re-deployed when device requirements change.
