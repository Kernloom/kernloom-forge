apiVersion: kernloom.io/v1alpha1
kind: RuntimeActionCatalog
metadata:
  name: klshield-actions
  adapterRef: klshield
spec:
  actions:
    - id: network.flow_deny
      effect: restrictive
      scope: flow
      requirements:
        ttl: required
        lease: required
        audit: required
        autoRevert: required
      revertStrategy:
        type: restore_previous_state
      conflictPolicy:
        type: strongest_restriction_wins

    - id: network.flow_rate_limit
      effect: restrictive
      scope: flow
      requirements:
        ttl: required
        lease: required
        audit: required
        autoRevert: required
      revertStrategy:
        type: restore_previous_state
      conflictPolicy:
        type: strongest_restriction_wins
