kind: RuntimePolicy
apiVersion: forge.kernloom.io/v1alpha1

metadata:
  id: quarantine-sustained-anomaly
  description: Quarantine a source with sustained high anomaly score via intent.

when:
  language: cel
  expression: >
    signals.anomaly.score.combined > 0.85 &&
    signals.anomaly.state.sustained_seconds > 30

then:
  - type: intent_action
    intent: protection.source.quarantine
    target:
      source:
        value_from: signals.network.entity.src_ip
    ttl: 15m
    reason: sustained_anomaly
