apiVersion: kernloom.io/v1
kind: AlertRoute
metadata:
  name: alert-route.security-ops
spec:
  audience:
    type: group
    ref: kernloom-security-ops
  channels:
    - type: log
      ref: log.security-ops
    - type: email
      ref: channel.email
  deduplication:
    enabled: true
    window: 15m0s
    keys:
      - tenant.id
      - resource.id
      - detection.id
      - source.identity_or_ip
