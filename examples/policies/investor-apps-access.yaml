apiVersion: kernloom.io/v1
kind: AccessPolicy
metadata:
  name: investor-apps-access
  owner: security-architecture
  environment: production
spec:
  subject:
    type: role
    ref: investors
  action: access
  resource:
    type: application_group
    ref: investor-apps
  conditions:
    # CEL format — concise, directly usable by runtime PDPs
    - id: require-mfa
      type: authentication_strength
      signal: session.authentication.strength
      operator: eq
      value: mfa
      cel: "session.authentication.strength == 'mfa'"

    # Structured format — explicit fields, compiler derives CEL automatically
    - id: require-low-risk
      type: risk_level
      signal: subject.risk.level
      operator: eq
      value: low

    # Mixed format — both provided; CEL takes precedence for runtime evaluation
    - id: require-healthy-device
      type: device_posture
      signal: device.posture.status
      operator: eq
      value: healthy
      cel: "device.posture.status == 'healthy'"

  enforcementConstraints:
    allowDelegation: true
    allowSemanticDowngrade: true
    minimumFidelity: medium
    allowedDelegationOwners:
      - openziti-controller
    allowedRuntimeActions:
      - remove_kernloom_access_attribute
      - identity.disable
      - network.flow_deny
      - network.flow_rate_limit
    requireApprovalFor:
      - semantic_downgrade
      - runtime_delegation
      - runtime_action

  effect: allow
