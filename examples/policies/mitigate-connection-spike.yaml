kind: Policy
apiVersion: forge.kernloom.io/v1alpha2

metadata:
  id: mitigate-src-connection-spike
  name: Mitigate source connection spike
  description: >
    Rate-limit a source IP when its connection rate exceeds the learned baseline.
    Falls back to the global trigger when per-source confidence is too low.
    Autonomy mode: KLIQ derives the effective rate from autotune.

spec:
  context: runtime
  intent: protection.abuse.mitigate

  requirements:
    capabilities:
      - observe.network.connection
      - enforce.traffic.rate_limit
    min_granularity:
      - src_ip
    degradation:
      allow: false

  inputs:
    bindings:
      current_cps:
        from: signal
        id: network.metric.connections_per_second
        scope: src_ip
      src_upper:
        from: baseline
        signal: network.metric.connections_per_second
        scope: src_ip
        statistic: upper_bound
      src_confidence:
        from: baseline
        signal: network.metric.connections_per_second
        scope: src_ip
        statistic: confidence
      src_phase:
        from: baseline
        signal: network.metric.connections_per_second
        scope: src_ip
        statistic: phase
      global_upper:
        from: baseline
        signal: network.metric.connections_per_second
        scope: global
        statistic: upper_bound

  rules:
    - id: spike-above-per-source-baseline
      when:
        language: cel
        expression: >
          vars.src_phase == "stable" &&
          vars.src_confidence >= 0.7 &&
          vars.current_cps > vars.src_upper * 1.5
      effects:
        - type: action
          action: enforce.traffic.rate_limit
          target:
            granularity: src_ip
            value_from: signals.network.entity.src_ip
          constraints:
            ttl: 10m
          reason: connection_rate_above_learned_per_source_baseline

    - id: spike-above-global-baseline-fallback
      when:
        language: cel
        expression: >
          vars.src_confidence < 0.7 &&
          vars.current_cps > vars.global_upper * 1.5
      effects:
        - type: action
          action: enforce.traffic.rate_limit
          target:
            granularity: src_ip
            value_from: signals.network.entity.src_ip
          constraints:
            ttl: 10m
          reason: connection_rate_above_global_baseline_fallback
