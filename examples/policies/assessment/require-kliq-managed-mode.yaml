kind: Policy
apiVersion: forge.kernloom.io/v1alpha2

metadata:
  id: require-kliq-managed-mode
  name: Require KLIQ managed mode
  description: >
    KliqDeploymentConfig documents must use managed mode.
    Scoped via asset.asset_type so it only fires for KLIQ deployment configs.

spec:
  context: asset

  requirements:
    capabilities:
      - assess.config.asset

  rules:
    - id: kliq-not-in-managed-mode
      when:
        language: cel
        expression: >
          asset.asset_type == "kernloom.kliq.deployment" &&
          (
            !has(document.spec) ||
            !has(document.spec.runtime) ||
            document.spec.runtime.mode != "managed" ||
            !has(document.spec.runtime.forge_url) ||
            document.spec.runtime.forge_url == ""
          )
      effects:
        - type: violation
          severity: error
          field: "spec.runtime.mode"
          message: "KLIQ nodes in production must run in managed mode with forge_url set"
          remediation: >
            Set mode: managed and provide forge_url:
              spec:
                runtime:
                  mode: managed
                  forge_url: "https://forge.example.com:8443"
