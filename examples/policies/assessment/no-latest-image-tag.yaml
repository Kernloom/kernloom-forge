kind: Policy
apiVersion: forge.kernloom.io/v1alpha2

metadata:
  id: no-latest-image-tag
  name: Forbid :latest image tag
  description: >
    Container images must specify a pinned version tag or digest.

spec:
  context: asset

  requirements:
    capabilities:
      - assess.config.asset

  rules:
    - id: image-uses-latest-tag
      when:
        language: cel
        expression: >
          document.kind == "Deployment" &&
          has(document.spec) &&
          has(document.spec.template) &&
          document.spec.template.spec.containers.exists(c,
            c.image.endsWith(":latest") || !c.image.contains(":")
          )
      effects:
        - type: violation
          severity: error
          field: "spec.template.spec.containers[*].image"
          message: "Container image must not use :latest — pin a specific tag or digest"
          remediation: "Replace :latest with a specific version, e.g. nginx:1.25.3 or nginx@sha256:abc123"
