apiVersion: kernloom.io/v1
kind: AccessPolicy
metadata:
  name: investor-apps-access
  owner: security-architecture
  environment: prod
spec:
  subject:
    type: role
    ref: investors
  action: access
  resource:
    type: application_group
    ref: investor-apps
  conditions:
    - id: require-mfa
      type: authentication_strength
      signal: subject.auth_strength
      operator: gte
      value: mfa
    - id: require-low-risk
      type: risk_level
      signal: subject.risk.level
      operator: eq
      value: low
    - id: require-healthy-device
      type: device_posture
      signal: device.posture.status
      operator: eq
      value: healthy
  effect: allow
